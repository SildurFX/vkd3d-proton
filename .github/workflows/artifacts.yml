name: Artifacts (Package)

on:
  workflow_dispatch:
  push:
    branches:
      - v2.3.1-arm64ecV2
  pull_request:

env:
  LLVM_MINGW_VERSION: 20250920
  LLVM_MINGW_DIST: llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64

jobs:
  build-artifacts:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Force git:// submodule URLs to https://
        run: git config --global url."https://github.com/".insteadOf "git://github.com/"

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Install standard build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            mingw-w64-tools \
            meson \
            ninja-build \
            glslang-tools

      - name: Fetch ARM64EC-capable llvm-mingw toolchain
        run: |
          curl -LfO "https://github.com/bylaws/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_DIST}.tar.xz"
          tar xf "${LLVM_MINGW_DIST}.tar.xz"
          echo "LLVM_MINGW_BIN=$PWD/${LLVM_MINGW_DIST}/bin" >> "$GITHUB_ENV"

      - name: Point build-arm64ec.txt at the llvm-mingw toolchain by absolute path
        run: |
          sed -i "s#'arm64ec-w64-mingw32-#'${LLVM_MINGW_BIN}/arm64ec-w64-mingw32-#g" build-arm64ec.txt
          cat build-arm64ec.txt

      - name: Build release (win64 + win32 + arm64ec)
        run: |
          VERSION_NAME="${GITHUB_REF##*/}-${GITHUB_SHA::8}"
          ./package-release.sh "${VERSION_NAME}" build --no-package
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vkd3d-proton-${{ env.VERSION_NAME }}
          path: build/vkd3d-proton-${{ env.VERSION_NAME }}
          if-no-files-found: error