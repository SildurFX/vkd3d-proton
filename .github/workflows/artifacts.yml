name: Build vkd3d-proton (ARM64EC)

on:
  workflow_dispatch:
  push:
    branches: [ arm64ec ]

env:
  VKD3D_REF: v2.3.1
  LLVM_MINGW_VERSION: 20250920
  LLVM_MINGW_DIST: llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64

jobs:
  build-arm64ec:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out vkd3d-proton
        uses: actions/checkout@v4
        with:
          repository: HansKristian-Work/vkd3d-proton
          ref: ${{ env.VKD3D_REF }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip glslang-tools
          pip install --user meson

      - name: Fetch ARM64EC-capable llvm-mingw toolchain
        run: |
          curl -LO "https://github.com/bylaws/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_DIST}.tar.xz"
          tar xf "${LLVM_MINGW_DIST}.tar.xz"
          # Prepend to PATH for all later steps - must come before any host ar/binutils
          echo "$PWD/${LLVM_MINGW_DIST}/bin" >> "$GITHUB_PATH"

      - name: Write arm64ec meson cross-file
        run: |
          cat > build-arm64ec.txt <<'EOF'
          [binaries]
          ar = 'arm64ec-w64-mingw32-ar'
          c = ['arm64ec-w64-mingw32-gcc', '-march=armv8-a', '-mtune=cortex-a57']
          cpp = ['arm64ec-w64-mingw32-g++', '-march=armv8-a', '-mtune=cortex-a57']
          ld = 'arm64ec-w64-mingw32-ld'
          windres = 'arm64ec-w64-mingw32-windres'
          strip = 'arm64ec-w64-mingw32-strip'
          widl = 'arm64ec-w64-mingw32-widl'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'windows'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

      - name: Configure
        run: |
          meson setup build-arm64ec \
            --cross-file build-arm64ec.txt \
            --buildtype release \
            -Denable_extras=true \
            -Denable_tests=false

      - name: Build
        run: ninja -C build-arm64ec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vkd3d-proton-arm64ec-${{ env.VKD3D_REF }}
          path: |
            build-arm64ec/**/*.dll